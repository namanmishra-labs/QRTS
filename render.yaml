services:
  - type: web
    name: qr-attendance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 30
    healthCheckPath: /health
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: COORDINATOR_PASSWORD
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: QR_EMAIL_TEST_MODE
        value: "false"
      - key: QR_EMAIL_BULK_ENABLED
        value: "false"
      - key: QR_EMAIL_TEST_RECIPIENTS
        sync: false
