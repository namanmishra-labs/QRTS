<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b35">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>QRTS Attendance Scanner</title>
  <link rel="stylesheet" href="/static/app.css">
  <script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body class="scanner-page">
  <main class="scanner-shell">
    <div id="reader" class="reader" aria-label="QR camera preview"></div>
    <div class="camera-switch-row"><button class="secondary" id="switch-camera" type="button" hidden>Change Camera</button></div>
    <div class="scanner-controls">
      <button class="primary" id="start-scan" type="button">Start Scanner</button>
      <button class="secondary" id="stop-scan" type="button" disabled>Stop Scanner</button>
    </div>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  </main>

  <section id="attendance-modal" class="attendance-modal" role="dialog" aria-modal="true" aria-labelledby="attendee-name" aria-describedby="attendee-id" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button id="cancel-scan" class="modal-close secondary" type="button">Cancel</button>
      <span class="eyebrow">ATTENDEE VERIFIED</span>
      <h1 id="attendee-name"></h1>
      <p class="registration-line">Registration ID <strong id="attendee-id"></strong></p>
      <fieldset class="modal-checkpoints">
        <legend>Select checkpoint(s)</legend>
        <label><input type="checkbox" name="attendance-checkpoint" value="day1_morning"><span>Day 1 — Morning</span></label>
        <label><input type="checkbox" name="attendance-checkpoint" value="day1_evening"><span>Day 1 — Evening</span></label>
        <label><input type="checkbox" name="attendance-checkpoint" value="day2_morning"><span>Day 2 — Morning</span></label>
        <label><input type="checkbox" name="attendance-checkpoint" value="day2_evening"><span>Day 2 — Evening</span></label>
      </fieldset>
      <div id="modal-feedback" class="notice" role="alert" aria-live="assertive" hidden></div>
      <button id="confirm-update" class="primary full" type="button">Submit Attendance</button>
    </div>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
</body>
</html>
